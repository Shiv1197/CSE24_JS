<!DOCTYPE html>
<html>
<head>
    <title>Largest Number Finder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        input {
            margin: 5px;
            padding: 8px;
            width: 100px;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
        }
        h2 {
            color: blue;
        }
    </style>
</head>
<body>

    <h1>Largest Number Finder</h1>

    <input type="number" id="num1" placeholder="Number 1"><br>
    <input type="number" id="num2" placeholder="Number 2"><br>
    <input type="number" id="num3" placeholder="Number 3"><br>
    <input type="number" id="num4" placeholder="Number 4"><br>
    <input type="number" id="num5" placeholder="Number 5"><br>

    <button onclick="findLargest()">Find Largest</button>

    <h2 id="result"></h2>

    <script>
function findLargest() {
    let n1 = parseFloat(document.getElementById("num1").value);
    let n2 = parseFloat(document.getElementById("num2").value);
    let n3 = parseFloat(document.getElementById("num3").value);
    let n4 = parseFloat(document.getElementById("num4").value);
    let n5 = parseFloat(document.getElementById("num5").value);

    let largest;

    if (n1 >= n2 && n1 >= n3 && n1 >= n4 && n1 >= n5) {
        largest = n1;
    }
    else if (n2 >= n1 && n2 >= n3 && n2 >= n4 && n2 >= n5) {
        largest = n2;
    }
    else if (n3 >= n1 && n3 >= n2 && n3 >= n4 && n3 >= n5) {
        largest = n3;
    }
    else if (n4 >= n1 && n4 >= n2 && n4 >= n3 && n4 >= n5) {
        largest = n4;
    }
    else {
        largest = n5;
    }

    document.getElementById("result").innerHTML =
        "Largest Number = " + largest;
}
</script>

</body>
</html>
